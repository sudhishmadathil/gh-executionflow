name: Reusable Deployment
on:
    workflow_call:
        inputs:
            artifact-name:
                description: 'Name of the artifact to download'
                required: true
                type: string
                default: 'dist'
        outputs:
            result:
                description: 'Result of the deployment'
                value: ${{ jobs.deploy.outputs.outcome }}
jobs:
    deploy:
        outputs:
            outcome: ${{ steps.set-result.outputs.step-result }}
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/download-artifact@v4
              with:
                name: ${{ inputs.artifact-name }}
            - name: List files
              run: ls 
            - name: Output information
              run: echo "Deployed from reusable workflow"
            - name: Set result output value
              id: set-result
              run: echo "step-result=Deployment completed successfully" >> $GITHUB_OUTPUT